# Archivo de configuración PKCS#11 para un HSM (Hardware Security Module)
# Este archivo es usado para configurar el proveedor PKCS#11 en Java.

# Nombre del proveedor. Este es un nombre descriptivo para el proveedor PKCS#11.
name = MyHSMProvider

# Ruta a la librería nativa del HSM. Este es el archivo de la librería que 
# implementa la interfaz PKCS#11 para el HSM. Asegúrate de que esta ruta
# sea correcta y que el archivo sea accesible para la JVM.
library = /path/to/your/hsm/library.so